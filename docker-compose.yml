x-backend-base: &backend-base
  image: ai-translation-backend:dev
  volumes:
    - ./backend/src:/backend/src
    - ./.data:/data
  env_file: .env
  environment:
    - DATA_DIR=/data
  depends_on:
    - postgres
    - redis

services:
  # api owns the build; worker reuses the same image tag.
  # Avoids docker-bake parallel-build race when listing both services in `compose build`.
  api:
    <<: *backend-base
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"

  worker:
    <<: *backend-base
    command: arq app.workers.translate_worker.WorkerSettings

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    command: npm run dev
    volumes:
      - ./frontend/src:/frontend/src
      - ./frontend/public:/frontend/public
      - ./frontend/tsconfig.json:/frontend/tsconfig.json
      - ./frontend/next.config.mjs:/frontend/next.config.mjs:ro
      - ./frontend/tailwind.config.ts:/frontend/tailwind.config.ts:ro
      - ./frontend/postcss.config.mjs:/frontend/postcss.config.mjs:ro
      - ./frontend/components.json:/frontend/components.json:ro
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_URL=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aitranslation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
