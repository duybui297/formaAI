# =============================================================================
# nginx site config — AI Translation PoC
#
# Place this at /etc/nginx/sites-available/ai-translation on the server, then
# symlink into sites-enabled (see deploy steps in deploy/nginx/README or the
# block at the bottom of this file).
#
# This file is HTTP-only by default. Certbot will rewrite it in place to add
# the HTTPS server block + HTTP→HTTPS redirect (same pattern as your existing
# aicorelabs.click site). Do NOT pre-add the SSL block — let Certbot do it.
#
# Change `server_name` below if you want a different subdomain.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name translate.aicorelabs.click;

    # Uploads must fit MAX_UPLOAD_BYTES (default 50MB in .env.example) plus
    # multipart overhead. 100M leaves headroom; raise if you bump the backend.
    client_max_body_size 100M;

    # ---- Backend API (FastAPI on 127.0.0.1:7101) -----------------------------
    # Routes mount at /api/v1 in FastAPI (main.py). The trailing slash on
    # proxy_pass is REMOVED so the full /api/* path is forwarded unchanged:
    #   /api/v1/jobs          → 127.0.0.1:7101/api/v1/jobs  (FastAPI receives /api/v1/jobs)
    #   /api/v1/health        → 127.0.0.1:7101/api/v1/health
    location /api/ {
        proxy_pass http://127.0.0.1:7101;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE on /jobs/{id}/stream — buffering MUST be off or events stall
        # until the connection closes. nginx default is on.
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;

        # Long timeouts for SSE + large-job translation polls (default is 60s).
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;

        # Translation jobs can take minutes — disable chunked re-encoding so
        # large uploads stream through without being re-buffered.
        chunked_transfer_encoding off;
    }

    # ---- Frontend (Next.js on 127.0.0.1:7100) --------------------------------
    location / {
        proxy_pass http://127.0.0.1:7100;
        proxy_http_version 1.1;

        # WebSocket upgrade headers — Next.js dev HMR uses them; harmless in prod.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- Deploy steps --------------------------------------------------------
    # 1. Copy this file to the server:
    #      scp deploy/nginx/ai-translation.conf root@HOST:/etc/nginx/sites-available/ai-translation
    #
    # 2. Symlink into sites-enabled:
    #      sudo ln -s /etc/nginx/sites-available/ai-translation /etc/nginx/sites-enabled/
    #
    # 3. DNS — point translate.aicorelabs.click (A record) at the server IP.
    #    Wait for propagation: `dig +short translate.aicorelabs.click`
    #
    # 4. Test config + reload (HTTP-only at this stage):
    #      sudo nginx -t
    #      sudo systemctl reload nginx
    #
    # 5. Issue cert (Certbot edits THIS file in place to add the SSL block):
    #      sudo certbot --nginx -d translate.aicorelabs.click
    #
    # 6. Verify:
    #      curl -I https://translate.aicorelabs.click
    #      curl -I https://translate.aicorelabs.click/api/v1/health
    # --------------------------------------------------------------------------
}
