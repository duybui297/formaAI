[project]
name = "ai-translation-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "openai>=1.40,<2",
    "tiktoken>=0.7",
    "python-docx==1.2.0",
    "pymupdf>=1.26,<2",
    "python-pptx==1.0.2",
    "paddleocr>=3.5,<4",
    "fpdf2>=2.7,<3",
    "sse-starlette>=1.6,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "arq==0.27.0",
    "redis[hiredis]>=5.0",
    # Auth
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.3",
    "aiosmtplib>=3.0",
    "email-validator>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "aiosqlite>=0.19",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/app --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: unit tests (no external services)",
    "integration: integration tests (requires docker services)",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "fakeredis>=2.35.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "locust>=2.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
